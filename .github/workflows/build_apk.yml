name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Official Android Project
        run: |
          flutter create . --platforms=android --org com.cinemax --project-name cinemax_prime
          
          # Fix Kotlin Gradle Plugin version required by modern plugins
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.0.21"/' android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i -E 's/ext.kotlin_version = "[^"]+"/ext.kotlin_version = "2.0.21"/' android/build.gradle || true
            sed -i -E "s/ext.kotlin_version = '[^']+'/ext.kotlin_version = '2.0.21'/" android/build.gradle || true
          fi
          
          # Add Internet permissions to AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinemax-prime-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Cinemax Prime v1.0.${{ github.run_number }}"
          body: |
            🎬 **Cinemax Prime APK - Official Release**
            - Powered by Google Android ExoPlayer
            - Dual-Audio & Multi-language stream switching
            - Exact Cinemax Prime Website Dark UI
            - High-Speed Cloud CDN streaming
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
